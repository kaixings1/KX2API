<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Tool Parser</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1117;
      --panel: #171b26;
      --border: #2a3142;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #5b8def;
      --accent-hover: #7aa3f5;
      --success: #3ecf8e;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fb;
        --panel: #ffffff;
        --border: #d8deea;
        --text: #1a2233;
        --muted: #5c677d;
        --accent: #3b6fd9;
        --accent-hover: #2f5fc4;
        --success: #1f9d63;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.875rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    button:hover {
      border-color: var(--accent);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
    }

    .badge.yes {
      color: var(--success);
      border-color: color-mix(in srgb, var(--success) 35%, var(--border));
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .output-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel.compact {
      min-height: auto;
    }

    .panel.compact pre {
      min-height: auto;
      padding: 12px 16px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .panel-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    textarea,
    pre {
      margin: 0;
      flex: 1;
      width: 100%;
      border: 0;
      outline: none;
      resize: vertical;
      min-height: 360px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.6;
      background: transparent;
      color: var(--text);
    }

    pre {
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #c44;
      background: color-mix(in srgb, #c44 12%, var(--panel));
      color: #f88;
      font-size: 0.875rem;
      display: none;
    }

    .error.visible {
      display: block;
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>LLM Tool Parser</h1>
      <p class="subtitle">
        Paste raw LLM output and parse it into a unified tool call JSON format
      </p>
    </header>

    <div class="toolbar">
      <button class="primary" id="parseBtn" type="button">Parse</button>
      <button id="clearBtn" type="button">Clear</button>
      <button id="sampleBtn" type="button">Load sample</button>
      <span class="badge" id="countBadge">toolCalls: —</span>
    </div>

    <div class="grid">
      <section class="panel">
        <div class="panel-header">Input</div>
        <textarea id="input" spellcheck="false"
          placeholder='Paste LLM output, e.g.&#10;{"tool_calls":[{"tool_name":"fileRead","arguments":{"filePath":"/path/to/file"}}]}'></textarea>
      </section>
      <div class="output-column">
        <section class="panel compact">
          <div class="panel-header">looksLikeToolCall</div>
          <pre id="looksLikeOutput">—</pre>
        </section>
        <section class="panel">
          <div class="panel-header">Parsed result (JSON)</div>
          <pre id="output">{}</pre>
        </section>
      </div>
    </div>

    <div class="error" id="error"></div>
  </div>

  <script src="./parser.bundle.js"></script>
  <script>
    const SAMPLE =
      '{"tool_calls":[{"tool_name":"fileRead","arguments":{"filePath":"xxxx/yyyy/xxx/README.md"}}]}'

    const inputEl = document.getElementById('input')
    const outputEl = document.getElementById('output')
    const looksLikeOutputEl = document.getElementById('looksLikeOutput')
    const errorEl = document.getElementById('error')
    const countBadge = document.getElementById('countBadge')
    const parseBtn = document.getElementById('parseBtn')
    const clearBtn = document.getElementById('clearBtn')
    const sampleBtn = document.getElementById('sampleBtn')

    function showError(message) {
      if (!message) {
        errorEl.textContent = ''
        errorEl.classList.remove('visible')
        return
      }
      errorEl.textContent = message
      errorEl.classList.add('visible')
    }

    function parseInput() {
      showError('')
      const text = inputEl.value

      try {
        const looksLike = LlmToolParser.looksLikeToolCall(text)
        const result = LlmToolParser.parseLlmToolCalls(text)

        countBadge.textContent = 'toolCalls: ' + result.toolCalls.length
        countBadge.classList.toggle('yes', result.toolCalls.length > 0)

        looksLikeOutputEl.textContent = JSON.stringify(
          { looksLikeToolCall: looksLike },
          null,
          2
        )
        outputEl.textContent = JSON.stringify(result, null, 2)
      } catch (err) {
        showError(err instanceof Error ? err.message : String(err))
        looksLikeOutputEl.textContent = '—'
        outputEl.textContent = '{}'
        countBadge.textContent = 'toolCalls: —'
        countBadge.classList.remove('yes')
      }
    }

    parseBtn.addEventListener('click', parseInput)
    clearBtn.addEventListener('click', () => {
      inputEl.value = ''
      looksLikeOutputEl.textContent = '—'
      outputEl.textContent = '{}'
      showError('')
      countBadge.textContent = 'toolCalls: —'
      countBadge.classList.remove('yes')
    })
    sampleBtn.addEventListener('click', () => {
      inputEl.value = SAMPLE
      parseInput()
    })

    let debounceTimer
    inputEl.addEventListener('input', () => {
      clearTimeout(debounceTimer)
      debounceTimer = setTimeout(parseInput, 300)
    })

    inputEl.value = SAMPLE
    parseInput()
  </script>
</body>

</html>
