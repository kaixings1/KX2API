name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-mock:
    name: Mock 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Mock 测试
        run: npx tsx tools/test-multiagent-complete.ts

  test-real-llm:
    name: 真实 LLM 测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 真实 LLM 测试
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'step-3.7-flash' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.stepfun.com/step_plan/v1' }}
        run: npx tsx tools/test-multiagent-real.ts
