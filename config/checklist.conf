# 诊断检查项配置
# 格式: 检查项名称|启用状态|阈值|描述

[system_resources]
cpu_check=enabled
cpu_threshold=90
memory_check=enabled
memory_threshold=85
disk_check=enabled
disk_threshold=80

[services]
ssh=enabled
docker=enabled
nginx=enabled
mysql=enabled
postgresql=disabled
redis=disabled

[network]
ping_hosts=8.8.8.8,1.1.1.1,google.com
timeout=3
retry_count=2

[logs]
log_files=/var/log/syslog,/var/log/messages,/var/log/dmesg
error_keywords=error,fail,critical,panic
max_lines=10

[configs]
check_nginx=enabled
check_ssh=enabled
check_mysql=disabled

[notifications]
email_enabled=false
email_to=admin@example.com
slack_enabled=false
slack_webhook=
